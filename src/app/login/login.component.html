
<div class="component">
   <div class="login">
    <h2>Login</h2>
    <form  [formGroup]="loginform" (ngSubmit)="Submit()">
        <label for="name"></label><br>
        <input type="text" id="name" placeholder="name" formControlName="name"><br>
        <label for="password"></label><br>
        <input type="text" id="password" placeholder="password" formControlName="password"><br>
        <button>Sign In</button>
    </form>
   </div>
</div>
